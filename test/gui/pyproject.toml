[project]
name = "gui"
version = "0.1.0"
requires-python = ">=3.12"

dependencies = [
    "appium-python-client==5.3.*",
    "behave==1.3.*",
    "behave-html-pretty-formatter==1.16.*",
    "flask==3.1.* ; sys_platform == 'linux'",
    "imageio-ffmpeg==0.6.*",
    "mss==10.2.*",
    "numpy==2.5.* ; sys_platform == 'linux'",
    "openpyxl==3.1.*",
    "playwright==1.62.*",
    "psutil==7.2.*",
    "pyautogui==0.9.*",
    "pygobject==3.48.* ; sys_platform == 'linux'",
    "pypdf==6.14.*",
    "pyside6==6.11.*",
    "python-docx==1.2.*",
    "python-pptx==1.0.*",
    "pywin32==312 ; sys_platform == 'win32'",
    "requests==2.34.*",
    "sure==2.0.*",
]

[dependency-groups]
lint = [
    "ruff==0.16.*",
    "vulture==2.16.*",
]

[tool.ruff]
line-length = 100

[tool.ruff.format]
quote-style = "preserve"

[tool.ruff.lint]
select = [
    "E",
    "F",
    "UP",
    "SIM",
    "N",
    "RUF",
    "PIE",
    "PLW2901",
    "DTZ",
    "RET",
    "ARG",
]

# Treat the following variable pattern as intentionally unused.
dummy-variable-rgx = "^(_.*|context|feature|self)$"

# See the available rules: https://docs.astral.sh/ruff/rules/
ignore = [
    "SIM105",   # Use `contextlib.suppress`
    "SIM110",   # Use `any()` instead of loop
    "N812",     # Lowercase imported as non-lowercase
]

[tool.ruff.lint.per-file-ignores]
"steps/*.py" = ["F811", "E501"]
"steps/vfs_context.py" = ["F821"]

[tool.vulture]
ignore_names = [
    "feature",
    "step",
    "after_scenario",
    "before_feature",
    "after_step",
    "before_scenario",
    "is_linux",
    "close_conn",
]

exclude = [".venv", "__webdriver",]
