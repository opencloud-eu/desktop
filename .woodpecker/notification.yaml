variables:
  - &golang_image 'quay.io/opencloudeu/golang-ci:1.26'
  - &qa_repo 'https://github.com/opencloud-eu/qa.git'
  - &qa_repo_branch 'main'
  - &current_repo_id '11'

when:
  - event:
      - push
      - manual
    branch: ${CI_REPO_DEFAULT_BRANCH}
    status:
      - success
      - failure
  - event: pull_request
    status:
      - failure
  - event: cron
    cron: nightly*
    status:
      - success
      - failure

depends_on:
  - build
  # - ui-tests

skip_clone: true

steps:
  - name: notify
    image: *golang_image
    environment:
      HTTP_PROXY:
        from_secret: ci_http_proxy
      HTTPS_PROXY:
        from_secret: ci_http_proxy
      MATRIX_HOME_SERVER: matrix.org
      MATRIX_ROOM_ALIAS:
        from_secret: opencloud-notifications-channel
      MATRIX_USER:
        from_secret: opencloud-notifications-user
      MATRIX_PASSWORD:
        from_secret: opencloud-notifications-user-password
      QA_REPO: *qa_repo
      QA_REPO_BRANCH: *qa_repo_branch
      CI_WOODPECKER_URL:
        from_secret: oc_ci_url
      CI_REPO_ID: *current_repo_id
      CI_WOODPECKER_TOKEN: no-auth-needed-on-this-repo
      MESSAGE_SUFFIX_WHEN_FAILED: 'CC @sajan:jankari.tech @pradip:jankari.tech @prashant:jankari.tech'
    commands:
      - git clone --single-branch --depth 1 --branch $QA_REPO_BRANCH $QA_REPO /tmp/qa
      - cd /tmp/qa/scripts/matrix-notification/
      - go run matrix-notification.go
